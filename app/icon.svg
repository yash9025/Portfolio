<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Black background like the X logo -->
  <rect width="100" height="100" fill="black" />
  
  <defs>
    <!-- Clip path to hide the right branch perfectly behind the left branch -->
    <clipPath id="right-side">
      <polygon points="41,18 100,18 100,100 59,100 59,52" />
    </clipPath>
  </defs>

  <!-- Group for the white letter Y -->
  <g fill="white">
    <!-- Left branch and stem (thick solid line) -->
    <!-- Top-left to stem-right, then straight down -->
    <polygon points="23,18 41,18 59,52 59,85 41,85 41,52" />
    
    <!-- Right branch (hollow / double line) -->
    <g clip-path="url(#right-side)">
      <!-- Inner line -->
      <polygon points="59,18 63.5,18 36.5,69 32,69" />
      <!-- Outer line -->
      <polygon points="72.5,18 77,18 50,69 45.5,69" />
    </g>
  </g>
</svg>
